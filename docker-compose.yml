name: enterprisehub

services:
  # ---------------- Databases ----------------
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: enterprisehub-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD:-YOUR_PASSWORD}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: enterprisehub-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterprisehub_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-YOUR_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    container_name: enterprisehub-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DB:-enterprisehub_billing}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-YOUR_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: enterprisehub-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: enterprisehub-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: enterprisehub-oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-YOUR_PASSWORD}
      APP_USER: ${ORACLE_USER:-enterprisehub}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-YOUR_PASSWORD}
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 15

  # ---------------- Messaging ----------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: enterprisehub-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    container_name: enterprisehub-kafka
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/bitnami/kafka

  # ---------------- App ----------------
  api:
    build:
      context: ./backend
      dockerfile: src/EnterpriseHub.API/Dockerfile
    container_name: enterprisehub-api
    depends_on:
      - mssql
      - postgres
      - mysql
      - mongo
      - redis
      - rabbitmq
    ports:
      - "${ASPNETCORE_HTTP_PORT:-5001}:8080"
      - "${ASPNETCORE_HTTPS_PORT:-7001}:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
    container_name: enterprisehub-frontend
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:5001}

volumes:
  mssql-data:
  postgres-data:
  mysql-data:
  mongo-data:
  redis-data:
  oracle-data:
  rabbitmq-data:
  kafka-data:
