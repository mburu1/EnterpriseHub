services:
  api:
    build:
      target: build
    volumes:
      - ./backend:/src
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
    command: ["dotnet", "watch", "run", "--project", "src/EnterpriseHub.API", "--urls", "http://0.0.0.0:8080"]

  frontend:
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
