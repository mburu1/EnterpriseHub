backend:
  image:
    repository: ghcr.io/mburu1/enterprisehub-api
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  image:
    repository: ghcr.io/mburu1/enterprisehub-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

ingress:
  enabled: true
  className: nginx
  host: enterprisehub.local

config:
  aspnetcoreEnvironment: Production

# Secrets are intentionally NOT templated here — supply via `--set-file`,
# `helm install -f secrets.yaml` (untracked), or an external secrets operator.
