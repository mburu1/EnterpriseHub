apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprisehub-backend
  namespace: enterprisehub
  labels:
    app: enterprisehub-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enterprisehub-backend
  template:
    metadata:
      labels:
        app: enterprisehub-backend
    spec:
      containers:
        - name: api
          image: ghcr.io/mburu1/enterprisehub-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: enterprisehub-config
            - secretRef:
                name: enterprisehub-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: enterprisehub-backend
  namespace: enterprisehub
spec:
  selector:
    app: enterprisehub-backend
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
