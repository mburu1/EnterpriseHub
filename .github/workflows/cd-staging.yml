name: CD - Staging

# Deploys to the staging AKS cluster whenever develop is updated, once Docker images have
# been published. Requires repo secret KUBE_CONFIG_STAGING (base64 kubeconfig); if it's not
# configured yet, the deploy step is skipped rather than failing the run.

on:
  workflow_run:
    workflows: ['Docker Publish']
    branches: [develop]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Check staging cluster credentials are configured
        id: check
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG_STAGING }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KUBE_CONFIG_STAGING secret is not set — skipping deploy. Configure it in repo settings to enable this stage."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up kubeconfig
        if: steps.check.outputs.configured == 'true'
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > "$HOME/.kube/config"

      - name: Set up kubectl
        if: steps.check.outputs.configured == 'true'
        uses: azure/setup-kubectl@v4

      - name: Apply manifests
        if: steps.check.outputs.configured == 'true'
        run: |
          kubectl apply -f infrastructure/k8s/namespaces.yml
          kubectl apply -f infrastructure/k8s/configmaps/app-config.yml
          kubectl apply -f infrastructure/k8s/redis-deployment.yml
          kubectl apply -f infrastructure/k8s/rabbitmq-deployment.yml
          kubectl apply -f infrastructure/k8s/kafka-deployment.yml
          kubectl apply -f infrastructure/k8s/backend-deployment.yml
          kubectl apply -f infrastructure/k8s/frontend-deployment.yml
          kubectl apply -f infrastructure/k8s/ingress.yml

      - name: Roll out latest images
        if: steps.check.outputs.configured == 'true'
        run: |
          kubectl -n enterprisehub set image deployment/enterprisehub-backend api=ghcr.io/${{ github.repository_owner }}/enterprisehub-api:develop
          kubectl -n enterprisehub set image deployment/enterprisehub-frontend frontend=ghcr.io/${{ github.repository_owner }}/enterprisehub-frontend:develop
          kubectl -n enterprisehub rollout status deployment/enterprisehub-backend --timeout=180s
          kubectl -n enterprisehub rollout status deployment/enterprisehub-frontend --timeout=180s
