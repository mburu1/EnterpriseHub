name: CI - Backend

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EnterpriseHub.slnx

      - name: Build
        run: dotnet build EnterpriseHub.slnx --no-restore --configuration Release

      - name: Check formatting
        run: dotnet format EnterpriseHub.slnx --verify-no-changes --no-restore --severity error

      # Integration and E2E suites spin up real containers (SQL Server, etc.) via Testcontainers,
      # which the ubuntu-latest runner's built-in Docker daemon supports without extra setup.
      - name: Test
        run: dotnet test EnterpriseHub.slnx --no-build --configuration Release --report-xunit-trx

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/**/TestResults/**/*.trx
